name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  build:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: hassanelmaayati
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%236B4226&color_dots=%23161b1a,%23234d35,%233a6b47,%235a8f5e,%2382b366
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A9744F&color_dots=%230d1117,%231b3a26,%232f5c38,%234a8352,%2373b06a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
